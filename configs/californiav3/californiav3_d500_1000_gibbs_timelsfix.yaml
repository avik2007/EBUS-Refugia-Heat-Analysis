schema_version: 1
config_kind: analysis
region: californiav3
date_start: '2015-01-01'
date_end: '2015-12-31'
lat_step: 0.5
lon_step: 0.5
time_step: 10.0
depth_range:
- 500
- 1000
input:
  source: s3
  s3_path: s3://argo-ebus-project-data-abm/californiav3_20150101_20151231_res0_5x0_5_t10_0_d500_1000.parquet
gpr:
  mode: 3D
  kernel_type: gibbs
  window_size_days: 45
  step_size_days: 10
  min_bins: 10
  noise_val: 0.1
  time_ls_bounds_days:
  - 15.0
  - 200.0
  lat_ls_bounds:
  - 0.01
  - 10.0
  lon_ls_bounds:
  - 0.01
  - 5.0
  run_suffix: "_timelsfix_d1500"
  kernel_gibbs:
    l_form: sigmoid_dist_to_coast
    l_min_km: 100.0
    l_max_km: 400.0
    d_transition_init_km: 300.0
    d_transition_bounds_km:
    - 50.0
    - 1500.0
    k_steepness_init: 0.01
    k_steepness_bounds:
    - 0.0001
    - 1.0
    anisotropy_lat_lon_ratio: 2.0
    anisotropy_lat_lon_ratio_bounds:
    - 1.0
    - 4.0
    climatology_source: roemmich-gilson-v3
description: >
  Gibbs non-stationary kernel run on Background layer (500-1000m).
  Mirrors Source layer Gibbs config for direct cross-layer comparison.
  Deep ocean control baseline — Pacific Blob Z-spikes (Jan-Feb, Sep 2015)
  expected to persist as genuine non-stationarity events not correctable by Gibbs.
  Re-run after fixing GibbsKernel time_ls units bug (dt was normalized [-1,1]
  but time_ls was physical days, so temporal decay barely applied regardless of
  fitted time_ls -- see test_gibbs_kernel_time_ls_converts_normalized_dt_to_days).
  d_transition_bounds_km upper widened 700->1500km (2026-09-16): prior run's
  median d0 landed exactly on the 700km bound (optimizer artifact, not a fitted
  value). 1500km chosen as just past the californiav3 domain's true max
  dist_to_coast (1404.8km, computed directly via calculate_dist_to_coast over
  the lat[30,48]/lon[-135,-115] box) -- gives the optimizer room to explore the
  full physical domain without truncation.
